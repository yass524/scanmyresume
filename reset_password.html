<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Set New Password — ATS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="min-h-screen grid place-items-center p-6">
    <section class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
      <h1 class="text-2xl font-semibold">Create a new password</h1>
      <p class="text-slate-400 mt-2 mb-6">Use at least 8 characters.</p>

      <form id="f" class="space-y-4">
        <input id="token" type="hidden" name="token" />
        <div>
          <label class="text-sm text-slate-300">New password</label>
          <input type="password" name="password" required minlength="8" class="mt-1 w-full rounded-xl bg-slate-900 border border-slate-800 p-3" />
        </div>
        <button class="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-black">Update password</button>
        <p id="msg" class="text-sm text-slate-300 min-h-5"></p>
      </form>

      <div class="mt-4 text-sm text-slate-400">
        Back to <a class="text-cyan-400 hover:underline" href="/login">Sign in</a>
      </div>
    </section>
  </main>

  <script>
    const qs = new URLSearchParams(window.location.search);
    document.getElementById('token').value = qs.get('token') || '';

    const form = document.getElementById('f');
    const msg = document.getElementById('msg');

    form.onsubmit = async (e) => {
      e.preventDefault();
      msg.textContent = 'Updating...';
      const fd = new FormData(form);
      try {
        const res = await fetch('/auth/reset-password', { method: 'POST', body: fd });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json?.detail || ('HTTP ' + res.status));
        msg.textContent = 'Password updated. Redirecting to login...';
        setTimeout(() => location.href = '/login', 900);
      } catch (err) {
        msg.textContent = err.message || 'Reset failed';
      }
    };
  </script>
</body>
</html>
