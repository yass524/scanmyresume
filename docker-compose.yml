version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ats-postgres
    environment:
      POSTGRES_USER: atsuser
      POSTGRES_PASSWORD: atspass
      POSTGRES_DB: atsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ats-api:local                 # the image you already built
    container_name: ats-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # override DB_URL from .env to point to Postgres
      DB_URL: postgresql+psycopg://atsuser:atspass@db:5432/atsdb
      COOKIE_SECURE: "0"                 # local only
      REPORT_DIR: /app/reports
    volumes:
      - ./reports:/app/reports

volumes:
  pgdata:
