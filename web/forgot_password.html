<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Forgot Password — ATS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="min-h-screen grid place-items-center p-6">
    <section class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
      <h1 class="text-2xl font-semibold">Reset your password</h1>
      <p class="text-slate-400 mt-2 mb-6">Enter your email to receive a reset link.</p>

      <form id="f" class="space-y-4">
        <div>
          <label class="text-sm text-slate-300">Email</label>
          <input type="email" name="email" required class="mt-1 w-full rounded-xl bg-slate-900 border border-slate-800 p-3" />
        </div>
        <button class="w-full py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-black">Send reset link</button>
        <p id="msg" class="text-sm text-slate-300 min-h-5"></p>
      </form>

      <div class="mt-4 text-sm text-slate-400">
        Back to <a class="text-cyan-400 hover:underline" href="/login">Sign in</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('f');
    const msg = document.getElementById('msg');
    form.onsubmit = async (e) => {
      e.preventDefault();
      msg.textContent = 'Sending...';
      const fd = new FormData(form);
      try {
        const res = await fetch('/auth/forgot-password', { method: 'POST', body: fd });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json?.detail || ('HTTP ' + res.status));
        msg.textContent = json?.message || 'If this email exists, a reset link was sent.';
      } catch (err) {
        msg.textContent = 'Request failed. Please try again.';
      }
    };
  </script>
</body>
</html>
